<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afeera Shahid - Countdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Official Portal Card Container -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden border border-blue-900/10">
        
        <!-- Royal Blue Header Banner -->
        <div class="bg-blue-900 text-white p-6 sm:p-8 text-center border-b-4 border-blue-700">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-2">Afeera shahid</h1>
            <div class="inline-block px-4 py-1.5 rounded-full bg-blue-950 text-blue-100 text-sm sm:text-base font-semibold border border-blue-800">
                Roll number: <span class="font-mono font-bold text-white ml-1">339646</span>
            </div>
        </div>

        <!-- Body Section with Countdown -->
        <div class="p-6 sm:p-8 bg-slate-50">
            <!-- Countdown Timer Grid -->
            <div class="grid grid-cols-4 gap-2 sm:gap-3 text-center">
                
                <!-- Days -->
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-blue-100 shadow-sm flex flex-col items-center justify-center">
                    <span id="days" class="text-2xl sm:text-4xl font-extrabold text-blue-900 font-mono">00</span>
                    <span class="text-[10px] sm:text-xs font-bold text-blue-950/60 uppercase tracking-wider mt-1">Days</span>
                </div>

                <!-- Hours -->
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-blue-100 shadow-sm flex flex-col items-center justify-center">
                    <span id="hours" class="text-2xl sm:text-4xl font-extrabold text-blue-900 font-mono">00</span>
                    <span class="text-[10px] sm:text-xs font-bold text-blue-950/60 uppercase tracking-wider mt-1">Hours</span>
                </div>

                <!-- Minutes -->
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-blue-100 shadow-sm flex flex-col items-center justify-center">
                    <span id="minutes" class="text-2xl sm:text-4xl font-extrabold text-blue-900 font-mono">00</span>
                    <span class="text-[10px] sm:text-xs font-bold text-blue-950/60 uppercase tracking-wider mt-1">Minutes</span>
                </div>

                <!-- Seconds -->
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-blue-100 shadow-sm flex flex-col items-center justify-center">
                    <span id="seconds" class="text-2xl sm:text-4xl font-extrabold text-blue-900 font-mono">00</span>
                    <span class="text-[10px] sm:text-xs font-bold text-blue-950/60 uppercase tracking-wider mt-1">Seconds</span>
                </div>

            </div>
        </div>

    </div>

    <!-- Live Countdown Script -->
    <script>
        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            // Target: October 22 at 10:00:00 AM (Month 9 = October)
            let targetDate = new Date(targetYear, 9, 22, 10, 0, 0);

            // If October 22 10:00 AM has already passed this year, set target to next year
            if (now > targetDate) {
                targetDate = new Date(targetYear + 1, 9, 22, 10, 0, 0);
            }

            const timeDifference = targetDate - now;

            if (timeDifference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        // Initialize immediately and set 1-second interval
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
